name: techworkshop-l300-ai-agents
infra:
  provider: bicep
  path: src/infra
  module: DeployAzureResources
services:
  chat-app:
    project: ./src
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      predeploy:
        shell: sh
        run: az containerapp ingress update --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$application_name" --target-port 8000 --output none
hooks:
  postprovision:
    shell: sh
    run: cd ./src && uv run python scripts/setup_solution.py
